[metadata]
name = pyJMAK
version = 0.1.0
author = Yousub Lee, Bhagyashree Prabhune, Srdjan Simunovic
description = A Python toolkit for phase transformation modeling using JMAK and KM models
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.8
install_requires =
    numpy
    matplotlib

[options.extras_require]
test =
    pytest

[options.entry_points]
console_scripts =
    jmak-run = pyJMAK.cli:main